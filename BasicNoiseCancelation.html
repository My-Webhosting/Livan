<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Phone Noise Reducer</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 700px;
  margin: auto;
}

h1 {
  text-align: center;
}

.card {
  background: #202020;
  border-radius: 16px;
  padding: 20px;
  margin: 15px 0;
}

button {
  border: 0;
  border-radius: 12px;
  padding: 14px 20px;
  margin: 5px;
  font-size: 16px;
}

.start {
  background: #25c46b;
  color: white;
}

.stop {
  background: #e04444;
  color: white;
}

input[type="range"] {
  width: 100%;
}

label {
  display: block;
  margin-top: 15px;
}

#status {
  text-align: center;
  padding: 10px;
  border-radius: 10px;
  background: #333;
}

iframe {
  width: 100%;
  aspect-ratio: 16 / 9;
  border: 0;
  border-radius: 12px;
}
</style>
</head>

<body>

<div class="container">

<h1>🎧 Phone Noise Reducer</h1>

<div class="card">

<div id="status">
Microphone stopped
</div>

<br>

<button class="start" onclick="startAudio()">
🎤 Start Microphone
</button>

<button class="stop" onclick="stopAudio()">
⛔ Stop
</button>

</div>


<div class="card">

<h2>🎚️ Microphone</h2>

<label>
Microphone level
<span id="micValue">30%</span>
</label>

<input
  id="micGain"
  type="range"
  min="0"
  max="1"
  value="0.3"
  step="0.01"
  oninput="updateControls()"
>

<label>
Noise reduction
<span id="noiseValue">70%</span>
</label>

<input
  id="noiseReduction"
  type="range"
  min="0"
  max="1"
  value="0.7"
  step="0.01"
  oninput="updateControls()"
>

</div>


<div class="card">

<h2>🎛️ Sound</h2>

<label>
Bass
<span id="bassValue">0 dB</span>
</label>

<input
  id="bass"
  type="range"
  min="-12"
  max="12"
  value="0"
  step="1"
  oninput="updateControls()"
>

<label>
Treble
<span id="trebleValue">0 dB</span>
</label>

<input
  id="treble"
  type="range"
  min="-12"
  max="12"
  value="0"
  step="1"
  oninput="updateControls()"
>

</div>


<div class="card">

<h2>📺 YouTube</h2>

<p>
Paste a YouTube video ID:
</p>

<input
  id="youtubeID"
  placeholder="Example: dQw4w9WgXcQ"
  style="
    width:100%;
    padding:14px;
    border-radius:10px;
    border:0;
    margin-bottom:10px;
  "
>

<button onclick="loadYouTube()">
▶️ Load YouTube
</button>

<div id="youtube"></div>

</div>

</div>


<script>

let audioContext = null;
let micStream = null;

let micSource = null;
let micGainNode = null;

let highPass = null;
let lowPass = null;

let bassFilter = null;
let trebleFilter = null;

let compressor = null;

let noiseGate = null;

let analyser = null;


/*
-----------------------------------------
START AUDIO
-----------------------------------------
*/

async function startAudio() {

  try {

    document.getElementById("status").textContent =
      "Requesting microphone...";

    /*
    Ask for microphone.

    Disabling browser noise suppression lets
    our Web Audio processing receive a more
    predictable signal.
    */

    micStream =
      await navigator.mediaDevices.getUserMedia({

        audio: {
          echoCancellation: false,
          noiseSuppression: false,
          autoGainControl: false,
          channelCount: 1
        },

        video: false

      });


    /*
    Low-latency AudioContext
    */

    audioContext =
      new AudioContext({
        latencyHint: "interactive"
      });


    await audioContext.resume();


    /*
    Microphone
    */

    micSource =
      audioContext.createMediaStreamSource(
        micStream
      );


    /*
    Microphone volume
    */

    micGainNode =
      audioContext.createGain();


    /*
    High-pass filter.

    Removes very low-frequency rumble.
    */

    highPass =
      audioContext.createBiquadFilter();

    highPass.type = "highpass";
    highPass.frequency.value = 80;


    /*
    Low-pass filter.

    Removes some high-frequency hiss.
    */

    lowPass =
      audioContext.createBiquadFilter();

    lowPass.type = "lowpass";
    lowPass.frequency.value = 11000;


    /*
    Bass
    */

    bassFilter =
      audioContext.createBiquadFilter();

    bassFilter.type = "lowshelf";
    bassFilter.frequency.value = 180;


    /*
    Treble
    */

    trebleFilter =
      audioContext.createBiquadFilter();

    trebleFilter.type = "highshelf";
    trebleFilter.frequency.value = 4000;


    /*
    Compressor prevents sudden loud sounds
    from becoming uncomfortable.
    */

    compressor =
      audioContext.createDynamicsCompressor();

    compressor.threshold.value = -18;
    compressor.knee.value = 20;
    compressor.ratio.value = 4;
    compressor.attack.value = 0.003;
    compressor.release.value = 0.15;


    /*
    Simple noise gate.

    It reduces very quiet microphone noise.
    */

    noiseGate =
      audioContext.createGain();

    noiseGate.gain.value = 1;


    /*
    Analyzer lets us monitor the signal.
    */

    analyser =
      audioContext.createAnalyser();

    analyser.fftSize = 512;


    /*
    Connect everything.
    */

    micSource
      .connect(highPass)
      .connect(lowPass)
      .connect(micGainNode)
      .connect(bassFilter)
      .connect(trebleFilter)
      .connect(compressor)
      .connect(noiseGate)
      .connect(analyser)
      .connect(audioContext.destination);


    updateControls();


    document.getElementById("status").textContent =
      "🎧 Microphone active — use headphones";


  } catch (error) {

    console.error(error);

    document.getElementById("status").textContent =
      "❌ Microphone permission failed: " +
      error.message;

  }

}


/*
-----------------------------------------
STOP AUDIO
-----------------------------------------
*/

function stopAudio() {

  if (micStream) {

    micStream
      .getTracks()
      .forEach(track => track.stop());

    micStream = null;

  }


  if (audioContext) {

    audioContext.close();

    audioContext = null;

  }


  document.getElementById("status").textContent =
    "Microphone stopped";

}


/*
-----------------------------------------
CONTROLS
-----------------------------------------
*/

function updateControls() {

  const mic =
    Number(document.getElementById("micGain").value);

  const noise =
    Number(document.getElementById("noiseReduction").value);

  const bass =
    Number(document.getElementById("bass").value);

  const treble =
    Number(document.getElementById("treble").value);


  document.getElementById("micValue").textContent =
    Math.round(mic * 100) + "%";

  document.getElementById("noiseValue").textContent =
    Math.round(noise * 100) + "%";

  document.getElementById("bassValue").textContent =
    bass + " dB";

  document.getElementById("trebleValue").textContent =
    treble + " dB";


  if (!audioContext) return;


  if (micGainNode)
    micGainNode.gain.value = mic;


  if (bassFilter)
    bassFilter.gain.value = bass;


  if (trebleFilter)
    trebleFilter.gain.value = treble;


  /*
  More noise reduction = lower quiet signal.

  This is deliberately conservative so it doesn't
  suddenly cut audio completely.
  */

  if (noiseGate) {

    noiseGate.gain.value =
      1 - (noise * 0.45);

  }

}


/*
-----------------------------------------
YOUTUBE
-----------------------------------------
*/

function loadYouTube() {

  const id =
    document.getElementById("youtubeID").value.trim();


  if (!id) {

    alert("Enter a YouTube video ID.");

    return;

  }


  /*
  Extract ID if the user pasted a full URL.
  */

  let videoID = id;


  try {

    if (id.includes("youtube.com")) {

      const url = new URL(id);

      videoID =
        url.searchParams.get("v") || id;

    }

    if (id.includes("youtu.be")) {

      videoID =
        new URL(id).pathname.substring(1);

    }

  } catch (e) {}


  document.getElementById("youtube").innerHTML = `

    <iframe
      src="https://www.youtube.com/embed/${videoID}?playsinline=1"
      allow="
        autoplay;
        encrypted-media;
        picture-in-picture
      "
      allowfullscreen>
    </iframe>

  `;

}

</script>

</body>
</html>
